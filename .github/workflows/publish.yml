name: Publish RunPod image
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: runpod-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned GVHMR revision
        id: gvhmr
        run: |
          revision="$(git rev-parse HEAD:third_party/GVHMR)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Free disk for CUDA layers
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/share/chromium
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: GVHMR_REVISION=${{ steps.gvhmr.outputs.revision }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
